name: docker

on:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: build test image
        run: docker build --target test -t sanitas:test .

      - name: run tests
        run: docker run --rm sanitas:test

      - name: ruff check
        run: docker run --rm sanitas:test ruff check .

      - name: ruff format
        run: docker run --rm sanitas:test ruff format --check .

      - name: redaction eval
        run: docker run --rm sanitas:test python eval/score.py