[project]
name = "sanitas"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Evan Hoefling", email = "evanh1393@gmail.com" }
]
requires-python = ">=3.13"
dependencies = [
    "en-core-web-lg",
    "presidio-analyzer>=2.2.364",
    "presidio-anonymizer>=2.2.364",
]

[project.scripts]
sanitas = "sanitas:main"

[build-system]
requires = ["uv_build>=0.12.19,<0.13.0"]
build-backend = "uv_build"

[tool.uv.sources]
en-core-web-lg = { url = "https://github.com/explosion/spacy-models/releases/download/en_core_web_lg-3.8.0/en_core_web_lg-3.8.0-py3-none-any.whl" }

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "ruff>=0.16.9",
]
